<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<title>Lectio+</title>
<style>
  :root { --bg:#fff; --card:#f6f7fb; --text:#161925; --muted:#6a7085; --line:#e6e8ef; --accent:#13566b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#13161e; --card:#1b1f2a; --text:#e9ebf3; --muted:#9298ad; --line:#2a2f3c; --accent:#74b9c8; } }
  * { box-sizing: border-box; }
  body { margin:0; width:300px; font:14px/1.4 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; align-items:center; gap:10px; padding:16px 16px 12px; }
  .logo { display:none; }
  header strong { font-size:16px; display:block; }
  header small { color:var(--muted); }
  .list { margin:0 12px 12px; background:var(--card); border-radius:12px; border:1px solid var(--line); }
  .row { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:11px 12px; border-top:1px solid var(--line); }
  .row:first-child { border-top:0; }
  .row div { display:flex; flex-direction:column; }
  .row small { color:var(--muted); font-size:12px; }
  .sw { position:relative; width:38px; height:22px; flex:none; }
  .sw input { opacity:0; width:0; height:0; }
  .sw i { position:absolute; inset:0; border-radius:99px; background:var(--line); transition:.15s; cursor:pointer; }
  .sw i::after { content:""; position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:50%; background:#fff; transition:.15s; box-shadow:0 1px 2px rgba(0,0,0,.2); }
  .sw input:checked + i { background:var(--accent); }
  .sw input:checked + i::after { transform:translateX(16px); }
  select { border:1px solid var(--line); background:var(--bg); color:var(--text); border-radius:8px; padding:4px 6px; font:inherit; }
  footer { padding:0 16px 14px; color:var(--muted); font-size:12px; }
  kbd { font:600 11px inherit; border:1px solid var(--line); border-radius:5px; padding:1px 5px; background:var(--card); }
</style>
</head>
<body>
<header>
  <div class="logo">L<span>+</span></div>
  <div><strong>Lectio<span style="color:var(--accent)">+</span></strong><small>Indstillinger</small></div>
</header>
<div class="list">
  <label class="row"><div>Slå Lectio+ til<small>Nyt design og menu</small></div><span class="sw"><input type="checkbox" data-k="enabled"><i></i></span></label>
  <label class="row"><div>Overblik på forsiden<small>Dashboard i stedet for forsiden</small></div><span class="sw"><input type="checkbox" data-k="dashboard"><i></i></span></label>
  <label class="row"><div>Nyt ugeskema<small>Pænere skema med detaljer</small></div><span class="sw"><input type="checkbox" data-k="skema"><i></i></span></label>
  <label class="row"><div>Egne visninger<small>Opgaver, lektier, fravær og karakterer</small></div><span class="sw"><input type="checkbox" data-k="views"><i></i></span></label>
  <div class="row"><div>Tema</div>
    <select data-k="theme"><option value="auto">Følg system</option><option value="light">Lyst</option><option value="dark">Mørkt</option></select>
  </div>
</div>
<footer>Tryk <kbd>Ctrl</kbd> + <kbd>K</kbd> eller <kbd>/</kbd> i Lectio for at søge og hoppe rundt.</footer>
<script src="popup.js"></script>
</body>
</html>
