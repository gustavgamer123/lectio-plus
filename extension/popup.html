<!doctype html>
<html lang="da" class="lp-on lp-popup">
<head>
<meta charset="utf-8">
<title>Lectio+ indstillinger</title>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header class="pp-bar"><b>Lectio<span>+</span></b><small id="pp-version"></small></header>
<main>
  <section class="pp-group" aria-labelledby="g-look">
    <h2 id="g-look">Udseende</h2>
    <label class="pp-row"><span>Tema</span>
      <select data-k="theme"><option value="auto">Følg computeren</option><option value="light">Lyst</option><option value="dark">Mørkt</option></select>
    </label>
  </section>

  <section class="pp-group" aria-labelledby="g-pages">
    <h2 id="g-pages">Sider</h2>
    <label class="pp-row"><span>Lectio+ er slået til<small>Nyt design på alle sider i Lectio</small></span><input type="checkbox" data-k="enabled"></label>
    <label class="pp-row"><span>Forside med overblik<small>Næste modul, lektier, afleveringer og ændringer</small></span><input type="checkbox" data-k="dashboard"></label>
    <label class="pp-row"><span>Ugeskema<small>Skemaet delt op efter tid</small></span><input type="checkbox" data-k="skema"></label>
    <label class="pp-row"><span>Egne visninger<small>Opgaver, lektier, beskeder, fravær, karakterer og studieplan</small></span><input type="checkbox" data-k="views"></label>
  </section>

  <section class="pp-group" aria-labelledby="g-notify">
    <h2 id="g-notify">Notifikationer</h2>
    <label class="pp-row"><span>Notifikationer fra Lectio<small>Lectio+ tjekker lectio.dk hvert 20. minut, også når Lectio er lukket (men Chrome kører), og holder dig logget ind så længe. Slå det fra på en computer, du deler med andre.</small></span><input type="checkbox" id="n-on"></label>
    <p class="pp-status" id="n-status" hidden></p>
    <div id="n-types" class="pp-sub">
      <label class="pp-row"><span>Nyt lokale i dag eller næste skoledag</span><input type="checkbox" data-n="room"></label>
      <label class="pp-row"><span>Aflyste og ændrede moduler</span><input type="checkbox" data-n="changed"></label>
      <label class="pp-row"><span>Nye beskeder</span><input type="checkbox" data-n="msg"></label>
      <label class="pp-row"><span>Frist om under et døgn</span><input type="checkbox" data-n="due"></label>
      <div class="pp-row pp-actions"><span></span><button type="button" class="pp-btn" id="n-now">Tjek nu</button></div>
    </div>
  </section>

  <section class="pp-group" aria-labelledby="g-subj">
    <h2 id="g-subj">Huskeliste</h2>
    <p class="pp-help">Ting, der vises i "Klar til i morgen", når faget er på skemaet næste skoledag.</p>
    <ul id="r-list" class="pp-list"></ul>
    <form id="r-add" class="pp-add"><select id="r-subj" aria-label="Fag"></select><input id="r-text" type="text" maxlength="60" placeholder="Fx idrætstøj" aria-label="Ting at huske"><button type="submit" class="pp-btn">Tilføj</button></form>
  </section>

  <section class="pp-group" aria-labelledby="g-about">
    <h2 id="g-about">Om</h2>
    <p class="pp-help"><b>Dine data bliver hos dig.</b> Lectio+ henter kun fra lectio.dk og gemmer alt på din egen computer.</p>
    <p class="pp-help">Søg i Lectio med <kbd>Ctrl</kbd> + <kbd>K</kbd> eller <kbd>/</kbd>. <a href="https://gustavgamer123.github.io/lectio-plus/" target="_blank" rel="noopener">Hjemmeside</a></p>
  </section>
</main>
<script src="popup.js"></script>
</body>
</html>
